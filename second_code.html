<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | New Element</title>
    <link rel="stylesheet" href ="style.css">
</head>
<body>
    <form action=" ">
        <label for="name">Enter Your Name :</label>
        <input type="text" name="my name" id="name" placeholder="enter tour name...">
        <br>
        <br>
        <label for="password">Enter your password:</label>
        <input type="password" id="password" name="my password" placeholder="password">
        <br>
        <br>
        <label for="date">Enter your dob:</label>
        <input type="date" id="date" name="my DOB" placeholder="enter DOB">
        <br>
        <br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" value="male" name="gender">
        <label for="male">Male</label>
        <input type="radio" id="female" value="female" name="gender">
        <label for="female">Female</label>
        <input type="radio" id="others" value="others" name="gender">
        <label for="others">Others</label>
        <br>
        <br>
        <label for="hobbies">Select Your hobbies:</label>
        <input type="checkbox" id="playing" name="Hobbies" value="playing">
        <label for="playing">Playing</label>
        <input type="checkbox" id="reading" name="Hobbies" value="reading">
        <label for="reading">Reading</label>
        <input type="checkbox" id="dancing" name="Hobbies" value="dancing">
        <label for="dancing">Dancing</label>
        <br>
        <br>
        <label for="gmail">Enter your gmail:</label>
        <input type="email" id="gmail" name="Your Gmail">
        <br>
        <br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
